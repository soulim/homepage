baseURL = "https://sul.im/"
copyright = "Alexander Sulim"
locale = "en-US"
title = "Alexander Sulim"
enableEmoji = true
# ignoreErrors = ["error-remote-getjson"]     # Ignore error in offline mode

[sitemap]
priority = 0.5

[menus]
  [[menus.main]]
    title = "home"
    name = "Home"
    pageRef = '/'
    weight = 10
  [[menus.main]]
    title = "TIL"
    name = "TIL"
    pageRef = '/til'
    weight = 20
  [[menus.main]]
    title = "blog"
    name = "Blog"
    pageRef = "/blog"
    weight = 30
  [[menus.main]]
    title = "now"
    name = "Now"
    pageRef = "/now"
    weight = 40
  [[menus.main]]
    title = "about"
    name = "About"
    pageRef = "/about"
    weight = 50
  # [[menus.main]]
  #   title = "RSS"
  #   name = "RSS"
  #   url = "/blog/index.xml"
  #   weight = 50

[privacy]
  [privacy.x]
    disable = false
    enableDNT = true
    simple = true
    disableInlineCSS = true
  [privacy.youtube]
    disable = false
    privacyEnhanced = true

[server]
  [[server.headers]]
    for = "/*"
    [server.headers.values]
      X-Frame-Options = "DENY"
      Content-Security-Policy = """\
                                default-src 'none'; \
                                base-uri 'self'; \
                                form-action 'self'; \
                                connect-src 'self'; \
                                font-src 'self'; \
                                frame-src 'self' https://www.youtube-nocookie.com; \
                                img-src 'self' data:; \
                                manifest-src 'self'; \
                                media-src 'self'; \
                                object-src 'none'; \
                                script-src 'self'; \
                                style-src 'self' 'unsafe-inline'; \
                                frame-ancestors 'none'\
                                """

[build]
  [build.buildStats]
    enable = true
